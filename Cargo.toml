[package]
name = "donors"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module is added by maturin (pyproject.toml), so `cargo test` can link
pyo3 = { version = "0.23", features = ["abi3-py312"] }
rand_core = "0.9"
rand_xorshift = "0.4"

[profile.release]
opt-level = 3
lto = true
